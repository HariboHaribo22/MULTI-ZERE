<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MULTI-ZERE v1.2 - Мультивселенная Зере</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-primary: #000000;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #0a0a0a;
            --text-primary: #FFFFFF;
            --text-secondary: #AAAAAA;
            --border-color: #444444;
            --accent-color: #FFFFFF;
        }

        body.theme-green {
            --bg-primary: #0a1a0a;
            --bg-secondary: #1a2a1a;
            --bg-tertiary: #0a1a0a;
            --text-primary: #00FF00;
            --text-secondary: #00AA00;
            --border-color: #00AA00;
            --accent-color: #00FF00;
        }

        body.theme-blue {
            --bg-primary: #000a1a;
            --bg-secondary: #1a2a3a;
            --bg-tertiary: #0a1a2a;
            --text-primary: #00FFFF;
            --text-secondary: #0088FF;
            --border-color: #0088FF;
            --accent-color: #00FFFF;
        }
        
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: Arial, sans-serif;
            overflow-x: hidden;
            padding: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes citadelGlow {
            0%, 100% { text-shadow: 0 0 10px #FF00FF, 0 0 20px #00FFFF; }
            50% { text-shadow: 0 0 20px #FF00FF, 0 0 30px #00FFFF, 0 0 40px #FFFF00; }
        }

        .container {
            min-height: 100vh;
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
        }

        .header h1 {
            margin: 5px 0;
            font-size: 1.8em;
            letter-spacing: 2px;
        }

        .header.citadel h1 {
            animation: citadelGlow 2s infinite;
        }

        .header p {
            margin: 0;
            font-size: 0.9em;
            color: var(--text-secondary);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 10px 15px;
            background: #333333;
            color: var(--text-primary);
            border: 2px solid var(--border-color);
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            text-transform: uppercase;
            font-size: 0.85em;
        }

        .tab-btn.active {
            background: var(--accent-color);
            color: var(--bg-primary);
            border-color: var(--accent-color);
        }

        .tab-btn:hover:not(:disabled) {
            background: var(--border-color);
        }

        .tab-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pull-area {
            background: var(--bg-secondary);
            border: 2px solid var(--text-primary);
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 15px;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .spinning {
            font-size: 60px;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }

        .diamond {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .empty-diamond {
            font-size: 50px;
            margin-bottom: 10px;
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 1em;
            font-weight: bold;
            color: var(--bg-primary);
            background: var(--text-primary);
            border: 2px solid var(--text-primary);
            border-radius: 3px;
            cursor: pointer;
            margin-bottom: 15px;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover:not(:disabled) {
            opacity: 0.8;
        }

        button:disabled {
            background: #333333;
            color: #666666;
            cursor: not-allowed;
        }

        .stats {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 3px;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 0.9em;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.3em;
            font-weight: bold;
        }

        .stat-full {
            grid-column: 1 / -1;
        }

        .collection {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 3px;
            padding: 12px;
            margin-bottom: 15px;
            max-height: 300px;
            overflow-y: auto;
        }

        .section-title {
            font-size: 0.85em;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .zere-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .zere-card {
            border: 1px solid var(--border-color);
            border-radius: 3px;
            padding: 8px;
            background: var(--bg-tertiary);
            opacity: 0.5;
            font-size: 0.8em;
        }

        .zere-card.owned {
            opacity: 1;
            background: var(--bg-secondary);
        }

        .zere-name {
            font-weight: bold;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .zere-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .zere-rarity {
            color: var(--text-secondary);
            font-size: 0.75em;
        }

        .zere-count {
            color: var(--bg-primary);
            padding: 2px 6px;
            border-radius: 2px;
            font-weight: bold;
            font-size: 0.85em;
        }

        .history {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 3px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .history-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px;
        }

        .history-card {
            border: 1px solid var(--border-color);
            border-radius: 3px;
            padding: 8px;
            text-align: center;
            background: var(--bg-tertiary);
            font-size: 0.75em;
        }

        .progress-bar {
            background: #333333;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            height: 20px;
            margin: 10px 0;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #00FFFF, #FF00FF);
            height: 100%;
            text-align: center;
            font-size: 0.7em;
            color: var(--text-primary);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hidden {
            display: none;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            padding: 20px;
            overflow-y: auto;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 2px solid var(--text-primary);
            border-radius: 10px;
            padding: 20px;
            max-width: 400px;
            width: 100%;
            color: var(--text-primary);
        }

        .modal-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }

        .setting-group {
            margin-bottom: 20px;
        }

        .setting-label {
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-size: 0.9em;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .option-btn {
            padding: 10px;
            background: #333333;
            border: 2px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn.selected {
            background: var(--accent-color);
            color: var(--bg-primary);
            border-color: var(--accent-color);
        }

        .close-modal {
            width: 100%;
            margin-top: 15px;
            padding: 10px;
        }

        .settings-btn {
            width: 100%;
            padding: 12px;
            font-size: 1em;
            font-weight: bold;
            color: var(--bg-primary);
            background: var(--text-primary);
            border: 2px solid var(--text-primary);
            border-radius: 3px;
            cursor: pointer;
            margin-bottom: 15px;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .settings-btn:hover {
            opacity: 0.8;
        }
    </style>
</head>

        <div class="pull-area" id="pullArea">

        <div class="stats">

                <div class="stat-value" id="pullCount">0</div>

        <div class="collection">

            Made By Barbos & Claude ❤️
        </div>
    </div>

    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-title" id="settingsTitle">Кастомизация</div>

            <div class="setting-group">
                <div class="setting-label" id="themeLabel">Тема</div>
                <div class="options">
                    <button class="option-btn selected" onclick="changeTheme('classic')" id="themeClassic">Классический</button>
                    <button class="option-btn" onclick="changeTheme('green')" id="themeGreen">Зелёный</button>
                    <button class="option-btn" onclick="changeTheme('blue')" id="themeBlue">Синий</button>
                </div>
            </div>

            <div class="setting-group">
                <div class="setting-label" id="langLabel">Язык</div>
                <div class="options">
                    <button class="option-btn" onclick="changeLanguage('kk')" id="langKk">Қазақша</button>
                    <button class="option-btn selected" onclick="changeLanguage('ru')" id="langRu">Русский</button>
                    <button class="option-btn" onclick="changeLanguage('en')" id="langEn">English</button>
                </div>
            </div>

            <button class="close-modal" onclick="closeSettings()" id="closeBtn">Закрыть</button>
        </div>
    </div>
